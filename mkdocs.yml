site_name: ME/CFS Bioinformatics Home
repo_url: https://github.com/trafalmadorian97/mecfs_bioinformatics
edit_uri: edit/main/docs/
theme:
  name: material
  # Overrides the nav-item partial so the sidebar reads the short nav_title set
  # by docs_hooks.py, while search/tags/browser-tab use the verbose page title.
  custom_dir: overrides
  features:
#    - navigation.indexes
    - toc.integrate
    - content.footnote.tooltips
    - content.action.edit
    - content.action.view
# Build hooks. docs_hooks.py disambiguates analysis-page titles for search/tags.
hooks:
- docs_hooks.py
plugins:
- search
# Backs docs/Analysis/Index_of_Techniques.md, which groups the analysis pages by
# the technique they use. tags_allowed is an allow list: a tag outside it fails
# the build, so a typo in a page's front matter cannot silently create a new tag.
- tags:
    listings_toc: false
    tags_allowed:
      - LDSC
      - S-LDSC
      - CT-LDSC
      - MAGMA
      - H-MAGMA
      - Mendelian randomization
      - MiXeR
      - SuSiE
      - LCV
- exclude-search:
      exclude:
        - reference/* # avoid cluttering search with code files
- macros
- glightbox
- awesome-nav
- bibtex:
    bib_file: "docs/refs.bib"
- git-committers:
    repository: trafalmadorian97/mecfs_bioinformatics
    enabled: !ENV [HAVE_GH_TOKEN, false]
    token: !ENV [GH_TOKEN, "none"]
    branch: main
    exclude:
      [index.md]
    exclude_committers:
      - web-flow

- mkdocstrings:
   handlers:
      python:
        inventories:
          - https://docs.python.org/3/objects.inv
        options:
          extra:
            paths: [.]
          docstring_section_style: list # or "table"
          docstring_style: "numpy"
          filters: [ "!^_" ]
          heading_level: 1
          merge_init_into_class: true
          parameter_headings: true
          separate_signature: true
          show_root_heading: true
          show_signature_annotations: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          show_if_no_docstring: true
          summary: true
- api-autonav:
    modules: ['mecfs_bio']
    exclude: ['mecfs_bio.util']
    enabled: !ENV [ENABLE_API_AUTONAV, false]

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort-scinum.js
  - javascripts/tablesort-init.js
  # Backs the data_table macro in main.py. Loaded globally (UMD, so it lands on
  # window) because the macro's own script is an ES module and cannot export
  # Tabulator to the page scope itself.
  - https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js

extra_css:
  - https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css

markdown_extensions:
  - admonition
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences