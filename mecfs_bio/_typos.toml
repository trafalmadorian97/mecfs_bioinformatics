[files]
# Proteomics database manifests; not prose, and full of legitimate gene names and
# protein descriptions (SORD, SPRED2, Collectin-12, Mucin-1, ...) that trip the
# spellchecker. UKB-PPP has one manifest per cohort; CSF has a single aptamer manifest.
extend-exclude = ["**/*_ppp_manifest.csv", "**/csf_aptamer_manifest.csv"]

[default.extend-words]
ser="ser"
setp="setp"
Ponting="Ponting"
Catagories="Catagories" # this typo is produced in the LDSC output
HSA="HSA"
hsa="hsa"
Wirth="Wirth"